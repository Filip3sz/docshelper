version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docshelper-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: docshelper_db
      POSTGRES_USER: docsuser
      POSTGRES_PASSWORD: docspassword
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: