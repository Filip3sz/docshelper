spring.application.name=docshelper
server.port=8081
docshelper.learnauditor-url=http://localhost:8080/dashboard
docshelper.learnauditor-api-url=http://127.0.0.1:8080

# 1. Konfiguracja Ollama (LLM + Embeddings)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3.5:9b
spring.ai.ollama.embedding.options.model=bge-m3

# 2. Połączenie z PostgreSQL z kontenera Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/docshelper_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Konfiguracja Bazy Wektorowej (pgvector)
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1024

# 4. Konfiguracja Spring Data JPA
spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.cache=false

server.address=127.0.0.1

spring.config.import=optional:file:./.env[.properties]
