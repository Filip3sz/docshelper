<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>DocsHelper - Baza Wiedzy RAG</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: rgba(22, 30, 46, 0.7);
            --bg-chat: #0d1322;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            --accent-hover: #0ea5e9;
            --success: #34d399;
            --error: #f87171;
            --border: #1e293b;
            --border-glow: rgba(56, 189, 248, 0.3);
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            background-image: radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 2.75rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.05rem;
        }

        .card {
            background-color: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin: 0 0 16px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 14px;
            padding: 32px 20px;
            text-align: center;
            background-color: rgba(13, 19, 34, 0.5);
            cursor: pointer;
            position: relative;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--accent);
            background-color: rgba(56, 189, 248, 0.04);
            box-shadow: 0 0 15px var(--border-glow);
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .highlight {
            color: var(--accent);
            font-weight: 600;
        }

        .upload-actions {
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        #chat-box {
            background-color: var(--bg-chat);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 16px;
            scroll-behavior: smooth;
        }

        #chat-box::-webkit-scrollbar {
            width: 6px;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-msg {
            background: var(--accent-gradient);
            color: #0f172a;
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background-color: rgba(30, 41, 59, 0.7);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
            white-space: pre-wrap;
        }

        .input-group {
            display: flex;
            gap: 12px;
            background-color: var(--bg-chat);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 8px 12px 8px 16px;
            align-items: center; /* Idealne wyśrodkowanie w pionie */
        }

        .input-group:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--border-glow);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            max-height: 120px;
            min-height: 24px;
            outline: none;
            padding: 2px 0;
            line-height: 1.4;
        }

        button {
            background: var(--accent-gradient);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 40px;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #status-msg {
            font-size: 0.85rem;
            font-weight: 500;
            margin: 0;
            color: var(--text-muted);
        }

        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>DocsHelper</h1>
        <p>Inteligentna, lokalna baza wiedzy RAG</p>
    </div>

    <div class="card">
        <h2>📂 1. Indeksowanie Dokumentów</h2>
        <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
            <input accept=".pdf,.txt,.docx,.rtf,.md" id="file-input" onchange="updateFileName()" type="file">
            <div class="file-label" id="file-prompt">
                Przeciągnij plik tutaj lub <span class="highlight">kliknij, aby wybrać z dysku</span>
            </div>
        </div>
        <div class="upload-actions">
            <p id="status-msg">Obsługiwane pliki: .pdf, .txt, .docx, .rtf itp.</p>
            <button id="upload-btn" onclick="uploadFile()">Zindeksuj</button>
        </div>
    </div>

    <div class="card">
        <h2>💬 2. Zapytaj AI</h2>
        <div id="chat-box">
            <div class="message ai-msg">Cześć! Wgraj dokument powyżej i zadaj mi odnośnie niego dowolne pytanie.</div>
        </div>
        <div class="input-group">
            <textarea
                    id="question-input"
                    oninput="autoResize(this)"
                    onkeydown="handleKeyPress(event)"
                    placeholder="Napisz wiadomość... (Enter wysyła, Shift+Enter nowa linia)"
                    rows="1"></textarea>
            <button id="send-btn" onclick="askQuestion()">
                Wyślij
            </button>
        </div>
    </div>
</div>

<script>
    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    function updateFileName() {
        const input = document.getElementById('file-input');
        const prompt = document.getElementById('file-prompt');
        if (input.files.length > 0) {
            prompt.innerHTML = `Wybrano: <span class="highlight">${input.files[0].name}</span>`;
        }
    }

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
        }, false);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
    });

    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length > 0) {
            fileInput.files = files;
            updateFileName();
        }
    });

    function handleKeyPress(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            askQuestion();
        }
    }

    async function uploadFile() {
        const statusMsg = document.getElementById('status-msg');
        const uploadBtn = document.getElementById('upload-btn');

        if (fileInput.files.length === 0) {
            statusMsg.innerText = "❌ Wybierz plik przed indeksowaniem.";
            statusMsg.style.color = "var(--error)";
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        statusMsg.innerText = "⚡ Indeksowanie dokumentu...";
        statusMsg.style.color = "var(--accent)";
        uploadBtn.disabled = true;

        try {
            const response = await fetch('/api/rag/upload', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                statusMsg.innerText = "✅ Plik pomyślnie zindeksowany!";
                statusMsg.style.color = "var(--success)";
            } else {
                const errText = await response.text();
                statusMsg.innerText = `❌ Błąd: ${errText || 'Błąd serwera'}`;
                statusMsg.style.color = "var(--error)";
            }
        } catch (error) {
            statusMsg.innerText = "❌ Brak połączenia z serwerem.";
            statusMsg.style.color = "var(--error)";
        } finally {
            uploadBtn.disabled = false;
        }
    }

    async function askQuestion() {
        const questionInput = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');
        const chatBox = document.getElementById('chat-box');
        const question = questionInput.value.trim();

        if (!question) return;

        chatBox.innerHTML += `<div class="message user-msg">${escapeHtml(question)}</div>`;
        questionInput.value = '';
        questionInput.style.height = 'auto';
        chatBox.scrollTop = chatBox.scrollHeight;

        const aiResponseId = 'ai-res-' + Date.now();
        chatBox.innerHTML += `
            <div class="message ai-msg" id="${aiResponseId}">
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            </div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        sendBtn.disabled = true;

        try {
            const response = await fetch(`/api/rag/ask?question=${encodeURIComponent(question)}`);
            if (!response.ok) throw new Error('Błąd serwera');

            const answerText = await response.text();
            document.getElementById(aiResponseId).innerText = answerText;
        } catch (error) {
            document.getElementById(aiResponseId).innerText = "❌ Wystąpił błąd podczas pobierania odpowiedzi.";
            document.getElementById(aiResponseId).style.color = "var(--error)";
        } finally {
            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
